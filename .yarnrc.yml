# The dsh rc packages are published frequently; a fresh publish would be
# quarantined by the default 1d minimal-age gate.
npmMinimalAgeGate: 0h
# Physical node_modules so the dsh process can resolve this plugin's runtime
# imports when the source is loaded through a dev overlay (PnP has no
# on-disk package tree for the host to find).
nodeLinker: node-modules
